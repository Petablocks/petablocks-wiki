<!-- PETABLOCKS BookStack Custom Head
     Inject via: Admin → Settings → Customisation → Custom HTML Head Content -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #10b981 !important;
    --color-primary-light: #34d399 !important;
    --color-link: #10b981 !important;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    -webkit-font-smoothing: antialiased;
  }

  code, pre {
    font-family: 'JetBrains Mono', monospace !important;
  }

  /* PETABLOCKS Navbar & Header Styling */
  header.header {
    border-bottom: 1px solid rgba(16, 185, 129, 0.2) !important;
  }

  /* Custom Callouts / Alerts */
  .callout.info {
    border-left-color: #10b981 !important;
    background: rgba(16, 185, 129, 0.08) !important;
  }

  .callout.warning {
    border-left-color: #f59e0b !important;
    background: rgba(245, 158, 11, 0.08) !important;
  }

  .callout.danger {
    border-left-color: #ef4444 !important;
    background: rgba(239, 68, 68, 0.08) !important;
  }

  /* Custom Scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(16, 185, 129, 0.3);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(16, 185, 129, 0.6);
  }

  /* Active Sidebar links */
  .sidebar-page-list .active,
  .book-contents .current {
    color: #10b981 !important;
    font-weight: 600;
  }
</style>
